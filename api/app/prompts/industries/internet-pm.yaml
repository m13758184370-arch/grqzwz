slug: internet-pm
name_zh: "互联网-产品经理"

resume:
  keywords:
    required:
      - "需求分析"
      - "PRD"
      - "产品规划"
      - "数据分析"
      - "用户研究"
      - "项目推进"
      - "跨团队协作"
    bonus:
      - "AB测试"
      - "增长黑客"
      - "敏捷开发"
      - "OKR"
      - "用户画像"
      - "SQL"
      - "Figma"

  verb_patterns:
    strategy:
      - "主导"
      - "规划"
      - "定义"
      - "重塑"
      - "设计"
    execution:
      - "推动"
      - "落地"
      - "上线"
      - "优化"
      - "迭代"
    analysis:
      - "通过数据分析发现"
      - "基于用户调研洞察"
      - "利用AB测试验证"
      - "通过竞品分析识别"
    results:
      - "实现增长"
      - "提升"
      - "降低"
      - "缩短"
      - "达成"
      - "突破"

  sections:
    - "个人信息"
    - "个人总结"
    - "工作经历"
    - "项目经验"
    - "教育背景"
    - "专业技能"

  custom_instructions: |
    产品经理简历特殊要求：
    - 必须体现"用户思维"和"数据驱动"两大核心能力
    - 工作经历中需要体现"从需求到上线"的完整闭环
    - 项目经验中需要展示产品指标提升（DAU、留存率、转化率、GMV等）
    - 如果经验中有负责过日均千万级用户的产品，务必突出
    - 专业技能中至少包含一个数据分析工具（SQL/Excel/Tableau）和一个原型工具（Figma/Sketch/Axure）
    - 个人总结中要体现"用户价值"导向的思维模式
    - 避免空洞的形容词，所有的能力描述都需要有具体的项目或数据支撑

interview:
  role_types:
    - slug: c-end-pm
      name_zh: "C端产品经理"
    - slug: b-end-pm
      name_zh: "B端产品经理"
    - slug: growth-pm
      name_zh: "增长产品经理"
    - slug: ai-pm
      name_zh: "AI产品经理"
    - slug: strategy-pm
      name_zh: "策略产品经理"
    - slug: data-pm
      name_zh: "数据产品经理"

  professional_topics:
    - "需求分析与优先级排序"
    - "产品设计与用户体验"
    - "数据驱动与指标体系"
    - "项目管理与跨团队协作"
    - "用户增长与商业化"
    - "产品战略与路线图规划"
    - "AI与产品结合"
    - "竞品分析与市场洞察"
    - "用户研究与需求挖掘"
    - "产品上线与效果评估"

  professional_instructions: |
    产品经理面试专业题要求：
    - 题目必须结合实际产品场景，如"抖音推荐流如何提升用户时长"
    - 包含2-3道产品估算题，如"估算北京市一天的共享单车使用次数"
    - 包含2-3道产品设计题，如"为老年人设计一款短视频App"
    - 包含2-3道数据分析题，给出具体指标变化让候选人分析原因
    - 包含2-3道优先级排序题，如"资源有限时如何决定先做哪个需求"
    - 高级职位需要包含产品战略和团队管理相关题目
    - 每个题目都要有清晰的评估标准

  company_types:
    - slug: big-tech
      name_zh: "大厂"
      instructions: "考察系统性思考、方法论体系、跨部门影响力、数据驱动决策能力。偏好结构化思维强、能处理复杂组织关系的候选人。"
    - slug: startup
      name_zh: "创业公司"
      instructions: "考察从0到1能力、快速决策、全能型思维、成本意识。偏好自驱力强、能接受不确定性的候选人。"
    - slug: unicorn
      name_zh: "独角兽"
      instructions: "考察增长思维、业务判断力、执行速度、在快速增长中的适应能力。偏好既能做战略又能落地的候选人。"
    - slug: foreign
      name_zh: "外企"
      instructions: "考察沟通能力、流程意识、用户同理心、跨文化协作能力。偏好逻辑清晰、注重用户体验的候选人。"
    - slug: state-owned
      name_zh: "国企/央企"
      instructions: "考察稳重性、政策理解、合规意识、长远规划能力。偏好能够平衡业务需求与合规要求的候选人。"
